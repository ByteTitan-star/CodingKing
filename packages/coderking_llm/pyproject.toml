[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderking-llm"
version = "0.1.0"
description = "CoderKing L0: unified LLM adapter"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools.packages.find]
where = ["src"]
