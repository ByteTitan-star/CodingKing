[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderking-agent-core"
version = "0.1.0"
description = "CoderKing L1: pure agent loop"
requires-python = ">=3.12"
dependencies = ["coderking-llm>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
