name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests scripts packages
          ruff format --check src tests scripts packages
      - name: Layer boundaries
        run: python scripts/check_layer_deps.py
      - name: Tests
        env:
          CODERKING_OPENAI_API_KEY: test-key
          CODERKING_SANDBOX_MODE: local
        run: pytest -q -m "not docker and not live"
      - name: Desktop RPC bridge
        run: node --test desktop/rpc-bridge.test.mjs

  e2e-live:
    runs-on: ubuntu-latest
    # Runs when repo secret CODERKING_OPENAI_API_KEY is configured; otherwise skips.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live E2E
        env:
          CODERKING_OPENAI_API_KEY: ${{ secrets.CODERKING_OPENAI_API_KEY }}
          CODERKING_SANDBOX_MODE: local
        run: |
          if [ -z "$CODERKING_OPENAI_API_KEY" ]; then
            echo "No CODERKING_OPENAI_API_KEY secret — skipping live E2E"
            exit 0
          fi
          pytest -q -m live tests/e2e --tb=short
      - name: Upload live artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-artifacts
          path: |
            **/.coderking/**
            eval/reports/**
          if-no-files-found: ignore

  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Docker sandbox tests
        env:
          CODERKING_SANDBOX_MODE: docker
        run: pytest -q tests/test_docker.py tests/sandbox/test_network_docker.py tests/sandbox/test_microvm.py -m docker

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
