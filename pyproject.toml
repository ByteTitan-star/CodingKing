[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderking"
version = "1.0.2"
description = "CoderKing：自研 ReAct + Reflection 的工程化 Coding Agent（CLI + Web）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CoderKing" }]
keywords = ["coding-agent", "llm", "sandbox", "cli"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
  "websockets>=14.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
  "pre-commit>=4.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
coderking = "coderking.cli:app"

[project.urls]
Homepage = "https://github.com/ByteTitan-star/CodingKing"

[tool.setuptools.packages.find]
where = [
  "src",
  "packages/coderking_llm/src",
  "packages/coderking_agent_core/src",
  "packages/coderking_coding_agent/src",
  "packages/coderking_transport/src",
]

[tool.setuptools.package-data]
coderking = ["py.typed", "prompts/**/*.md", "templates/*.md"]
coderking_llm = ["py.typed"]
coderking_agent_core = ["py.typed"]
coderking_coding_agent = ["py.typed"]
coderking_transport = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
  "src",
  "scripts",
  "packages/coderking_llm/src",
  "packages/coderking_agent_core/src",
  "packages/coderking_coding_agent/src",
  "packages/coderking_transport/src",
]
markers = [
  "docker: tests that require a working Docker daemon",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "src",
  "tests",
  "scripts",
  "packages/coderking_llm/src",
  "packages/coderking_agent_core/src",
  "packages/coderking_coding_agent/src",
  "packages/coderking_transport/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/create_whitepaper_issues.py" = ["E501"]
"scripts/post_issue_implementation_plans.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
  "coderking",
  "coderking_llm",
  "coderking_agent_core",
  "coderking_coding_agent",
  "coderking_transport",
]