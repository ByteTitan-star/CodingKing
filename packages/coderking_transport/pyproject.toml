[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderking-transport"
version = "0.1.0"
description = "CoderKing L3: CLI / HTTP / RPC / Desktop transport"
requires-python = ">=3.12"
dependencies = [
  "coderking-coding-agent>=0.1.0",
  "coderking-agent-core>=0.1.0",
  "coderking-llm>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
